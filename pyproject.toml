version = "0.1.0"
description = "Competitor Intelligence Agent — MCP-based web scraper with Groq AI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "groq>=0.18.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "playwright>=1.52.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.10",
    "python-dotenv>=1.1.0",
    "mcp[cli]>=1.28.0",
]
